events {}

http {
    server {
        listen 80;

        # API RAG (FastAPI) -> service "api" du meme docker-compose
        location /api/ {
            proxy_pass http://api:8000/;
            proxy_set_header Host $host;
        }

        # Dashboard Qdrant -> service "qdrant" du meme docker-compose
        location /qdrant/ {
            proxy_pass http://qdrant:6333/;
            proxy_set_header Host $host;
        }

        # Prometheus -> service "prometheus" du meme docker-compose
        location /prometheus/ {
            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
        }

        # Airflow UI -> stack Docker separe (airflow/docker-compose.yaml),
        # pas joignable par nom de service -> on repasse par le port publie
        # sur l'hote, comme pour Ollama.
        location /airflow/ {
            proxy_pass http://host.docker.internal:8080/;
            proxy_set_header Host $host;
        }

        location / {
            return 200 "Zomato RAG stack: /api/docs  /qdrant/dashboard  /prometheus  /airflow\n";
            add_header Content-Type text/plain;
        }
    }
}