name: CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    # machine cloud fournie par GitHub, ephemere, detruite apres le job
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        working-directory: docker
        run: docker compose build

      - name: Push Docker image
        working-directory: docker
        run: docker compose push


  deploy:
    needs: build-and-push
    # PAS "ubuntu-latest" ici : "self-hosted" = ton PC, la ou tourne le
    # runner qu'on a installe. Le job s'execute directement dessus ->
    # plus besoin de ssh-action, tu es deja sur la machine cible.
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull la nouvelle image depuis Docker Hub
        working-directory: docker
        run: docker compose pull

      - name: Redemarre les services
        working-directory: docker
        run: docker compose up -d --force-recreate

      - name: Smoke test post-deploiement
        run: |
          sleep 5
          curl -sf http://localhost:8000/health || (echo "API pas en sante apres deploiement" && exit 1)